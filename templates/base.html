<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Darwin AI - Evolving Teaching Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="navbar">
      <a href="{{ url_for('index') }}" class="nav-brand">
        🧬 Darwin <span>AI</span>
      </a>
      <nav class="nav-links">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint in ['index', 'generate_lesson_route'] %}active{% endif %}">New Lesson</a>
        <a href="{{ url_for('agents_dashboard') }}" class="{% if request.endpoint == 'agents_dashboard' %}active{% endif %}">Agent Population</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
